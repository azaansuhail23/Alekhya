<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
</head>
<style>
    div{
        width:100px;
        height:100px;
        background-color: blue;
        transition:width 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1s;
        /* 
        1. on what you want to apply transition 
        2. Whole transition durtion
        3. Transition function
        4. Delay
         */
    }

    div:hover{
        width: 50vw;
    }

</style>
<body>
    <h1> Alekhya is learning CSS transition from mentor Azaan.</h1>

    <div></div>

    <!-- Note : Empty Div -->
</body>
</html>
