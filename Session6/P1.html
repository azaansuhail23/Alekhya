<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML table</title>
</head>

<style>
    table,th,td{
        border:1px solid black;
    }
</style>
<body>

    <table> 

        <tr>
            <th>Name</th>
            <th>Grade</th>
            <th>Age</th>
        </tr>


        <tr>
            <td>Alekha</td>
            <td>6th</td>
            <td>11</td>
        </tr>
        <tr>
            <td>Azaan</td>
            <td>12th</td>
            <td>24</td>
        </tr>
        <tr>
            <td>Sophie</td>
            <td>10th</td>
            <td>14</td>
        </tr>
    </table>

</body>
</html>
