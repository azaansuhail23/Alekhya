<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
</head>
<body>
    <!-- 1. Color name -->
    <h1 style="background-color:aquamarine">Azaan</h1>
    <h1 style="color:chocolate">Roy</h1>

    <!-- 2.RGB -->
     <p style="background-color:rgb(220, 64, 64);">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sint maxime consequuntur possimus.</p>

     <!-- 3. HEX Code -->
     <p style="background-color:#3cb371;">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sint maxime consequuntur possimus.</p>

     <!-- 4. HSL Code -->
     <p style="background-color:hsl(82, 81%, 77%);">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sint maxime consequuntur possimus.</p>
</body>
</html>
