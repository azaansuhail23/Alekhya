<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS</title>

    <!-- 2. Internal CSS : You are adding CSS in the HTML file onle-->
    <style>
        h2{
            background-color: aquamarine;
        }
        </style>


    <!-- 3. External CSS  : Created a external CSS file and linking it here in HTML-->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 1. Inline CSS  -->
    <h1 style="background-color: burlywood;">Inline CSS</h1>
    
    <h2 >Internal CSS</h2>

    <h3>External CSS</h3>
    
</body>
</html>

<!-- 1. Inline CSS  -->
<!-- 2. Internal CSS  -->
<!-- 3. External CSS  -->
