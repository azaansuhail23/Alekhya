<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List in HTML</title>
  </head>
  <body>
    <!-- Ordered List -->
    <ol>
      <li>Milk</li>
      <li>Grapes</li>
      <li>Orange</li>
      <li>Cheese</li>
    </ol>

    <hr />
    <!-- Unordered List -->
    <ul>
      <li>Milk</li>
      <li>Grapes</li>
      <li>Orange</li>
      <li>Cheese</li>
    </ul>

    <hr>

    <!-- Description List -->
    <dl>
        <dt>Coffee</dt>
        <dd>- black hot drink</dd>
        
        <dt>Milk</dt>
        <dd>- white cold drink</dd>
      </dl>
  </body>
</html>
